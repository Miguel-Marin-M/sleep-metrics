# ===========================================================================
# Configuracion de Alembic - SleepMetrics
#
# Los comandos de Alembic se ejecutan SIEMPRE desde la carpeta `backend/`,
# que es donde vive este archivo.
# ===========================================================================

[alembic]
# Carpeta con env.py y las migraciones.
script_location = alembic

# Nombre de los archivos de migracion generados.
# Anteponer el numero de revision hace que el listado del directorio quede en
# orden cronologico, algo que el hash aleatorio por si solo no consigue.
file_template = %%(rev)s_%%(slug)s

# Anade la carpeta actual (backend/) al sys.path para que `import app...`
# funcione dentro de env.py. Sin esta linea, `alembic revision --autogenerate`
# falla con ModuleNotFoundError: No module named 'app'.
prepend_sys_path = .

# Formato de las fechas en el nombre de las revisiones.
timezone = UTC

# IMPORTANTE: `sqlalchemy.url` se deja deliberadamente VACIO.
#
# La URL de conexion contiene la contrasena de la base de datos, y este archivo
# se versiona en git. La URL real se inyecta en tiempo de ejecucion desde la
# variable de entorno DATABASE_URL, dentro de alembic/env.py.
sqlalchemy.url =


# ---------------------------------------------------------------------------
# Configuracion de logging de Alembic
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# INFO para que el log del despliegue muestre que migraciones se aplican.
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
